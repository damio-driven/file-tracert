<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>FileTracert</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <!-- Loopback API token. The Host stamps the real value over the placeholder
       when it serves this file in production; ng serve leaves it untouched and
       the SPA falls back to GET /api/dev/token. -->
  <meta name="ft-token" content="__FT_TOKEN__">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
